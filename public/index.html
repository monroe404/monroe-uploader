<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monroe File Share</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

<div class="background"></div>

<main class="container">

    <!-- ========================= -->
    <!-- LOGIN -->
    <!-- ========================= -->

    <section
        id="loginPage"
        class="card login-card"
    >

        <div class="brand">
            <div class="brand-icon">M</div>

            <div>
                <h1>MONROE</h1>
                <p>FILE SHARE</p>
            </div>
        </div>

        <h2>Welcome Back</h2>

        <p class="muted">
            Login untuk mengakses Monroe File Share.
        </p>

        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="primary-btn"
            >
                LOGIN
            </button>

        </form>

        <div
            id="loginMessage"
            class="message"
        ></div>

    </section>


    <!-- ========================= -->
    <!-- DASHBOARD -->
    <!-- ========================= -->

    <section
        id="dashboardPage"
        style="display:none;"
    >

        <header class="topbar">

            <div class="brand">

                <div class="brand-icon">
                    M
                </div>

                <div>
                    <h1>MONROE</h1>
                    <p>FILE SHARE</p>
                </div>

            </div>

            <div class="user-area">

                <div>
                    <strong id="currentUsername">
                        -
                    </strong>

                    <small id="currentRole">
                        -
                    </small>
                </div>

                <button
                    id="logoutBtn"
                    class="secondary-btn"
                >
                    LOGOUT
                </button>

            </div>

        </header>


        <!-- ========================= -->
        <!-- PROFILE -->
        <!-- ========================= -->

        <section class="card">

            <div class="section-header">

                <div>
                    <span class="eyebrow">
                        ACCOUNT
                    </span>

                    <h2>
                        Your Profile
                    </h2>
                </div>

            </div>

            <form id="profileForm">

                <div class="grid">

                    <div class="field">

                        <label>
                            Display Name
                        </label>

                        <input
                            id="displayName"
                            type="text"
                            placeholder="Nama yang akan tampil"
                        >

                    </div>


                    <div class="field">

                        <label>
                            TikTok
                        </label>

                        <input
                            id="tiktok"
                            type="text"
                            placeholder="https://tiktok.com/@username"
                        >

                    </div>


                    <div class="field">

                        <label>
                            YouTube
                        </label>

                        <input
                            id="youtube"
                            type="text"
                            placeholder="https://youtube.com/@username"
                        >

                    </div>


                    <div class="field">

                        <label>
                            Discord Community
                        </label>

                        <input
                            id="discord"
                            type="text"
                            placeholder="https://discord.gg/..."
                        >

                    </div>

                </div>

                <button
                    type="submit"
                    class="secondary-btn"
                >
                    SAVE PROFILE
                </button>

                <div
                    id="profileMessage"
                    class="message"
                ></div>

            </form>

        </section>


        <!-- ========================= -->
        <!-- UPLOAD -->
        <!-- ========================= -->

        <!-- ================================= -->
<!-- UPLOAD SECTION -->
<!-- ================================= -->

<div class="upload-grid">

    <!-- PUBLIC FILE -->
    <div
        class="panel upload-panel"
        id="publicUploadPanel"
    >

        <div class="upload-header">
            <span class="upload-icon">🌐</span>

            <div>
                <h2>PUBLIC FILE</h2>
                <p>File yang dapat diakses secara publik.</p>
            </div>
        </div>

        <form
            id="publicUploadForm"
            enctype="multipart/form-data"
        >

            <input
                type="hidden"
                name="type"
                value="public"
            >

            <label>MOD / SHARE NAME</label>

            <input
                type="text"
                name="name"
                placeholder="Contoh: Monroe Vehicle Pack"
                required
            >

            <label>CREDITS / MAKER</label>

            <input
                type="text"
                name="credits"
                placeholder="Nama pembuat"
                required
            >

            <label>DESCRIPTION</label>

            <textarea
                name="description"
                placeholder="Deskripsi file..."
                required
            ></textarea>

            <label>PREVIEW IMAGE</label>

            <input
                type="file"
                name="preview"
                accept="image/*"
                required
            >

            <label>MOD FILES</label>

            <input
                type="file"
                name="files"
                multiple
                required
            >

            <button type="submit">
                📤 PUBLISH PUBLIC FILE
            </button>

            <div
                id="publicUploadMessage"
                class="message"
            ></div>

        </form>

    </div>


    <!-- SPECIAL FILE -->
    <div
        class="panel upload-panel"
        id="specialUploadPanel"
    >

        <div class="upload-header">
            <span class="upload-icon">🔒</span>

            <div>
                <h2>SPECIAL FILE</h2>
                <p>File khusus uploader.</p>
            </div>
        </div>

        <form
            id="specialUploadForm"
            enctype="multipart/form-data"
        >

            <input
                type="hidden"
                name="type"
                value="special"
            >

            <label>MOD / SHARE NAME</label>

            <input
                type="text"
                name="name"
                placeholder="Contoh: Private Mod Pack"
                required
            >

            <label>CREDITS / MAKER</label>

            <input
                type="text"
                name="credits"
                placeholder="Nama pembuat"
                required
            >

            <label>DESCRIPTION</label>

            <textarea
                name="description"
                placeholder="Deskripsi file..."
                required
            ></textarea>

            <label>PREVIEW IMAGE</label>

            <input
                type="file"
                name="preview"
                accept="image/*"
                required
            >

            <label>MOD FILES</label>

            <input
                type="file"
                name="files"
                multiple
                required
            >

            <button type="submit">
                🔒 PUBLISH SPECIAL FILE
            </button>

            <div
                id="specialUploadMessage"
                class="message"
            ></div>

        </form>

    </div>

</div>

            
        <!-- ========================= -->
        <!-- RESULT -->
        <!-- ========================= -->

        <section
            id="resultCard"
            class="card result-card"
            style="display:none;"
        >

            <div class="success-icon">
                ✓
            </div>

            <span class="eyebrow">
                PUBLISHED
            </span>

            <h2>
                File berhasil dipublish
            </h2>

            <p
                id="resultModName"
                class="muted"
            ></p>


            <div class="result-box">

                <label>
                    Share Link
                </label>

                <div class="copy-row">

                    <input
                        id="shareLink"
                        type="text"
                        readonly
                    >

                    <button
                        id="copyShareBtn"
                        type="button"
                        class="secondary-btn"
                    >
                        COPY
                    </button>

                </div>

            </div>


            <div class="result-actions">

                <a
                    id="openShareBtn"
                    href="#"
                    target="_blank"
                    class="primary-btn"
                >
                    OPEN SHARE
                </a>

                <a
                    id="downloadBtn"
                    href="#"
                    target="_blank"
                    class="secondary-btn"
                >
                    DOWNLOAD ZIP
                </a>

            </div>


            <div
                id="discordStatus"
                class="discord-status"
            ></div>

        </section>

    </section>

</main>


<script>

const loginPage =
    document.getElementById("loginPage");

const dashboardPage =
    document.getElementById("dashboardPage");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const logoutBtn =
    document.getElementById("logoutBtn");

const uploadForm =
    document.getElementById("uploadForm");

const publishBtn =
    document.getElementById("publishBtn");

const uploadMessage =
    document.getElementById("uploadMessage");

const profileForm =
    document.getElementById("profileForm");

const profileMessage =
    document.getElementById("profileMessage");

const filesInput =
    document.getElementById("files");

const fileList =
    document.getElementById("fileList");

const uploadProgress =
    document.getElementById("uploadProgress");

const progressFill =
    document.getElementById("progressFill");

const progressText =
    document.getElementById("progressText");

const resultCard =
    document.getElementById("resultCard");

const resultModName =
    document.getElementById("resultModName");

const shareLink =
    document.getElementById("shareLink");

const openShareBtn =
    document.getElementById("openShareBtn");

const downloadBtn =
    document.getElementById("downloadBtn");

const copyShareBtn =
    document.getElementById("copyShareBtn");

const discordStatus =
    document.getElementById("discordStatus");


// =================================
// MESSAGE
// =================================

function showMessage(
    element,
    text,
    type = ""
) {

    element.textContent = text;

    element.className =
        "message " + type;
}


// =================================
// LOAD CURRENT USER
// =================================

async function loadUser() {

    try {

        const response =
            await fetch("/api/me");

        const data =
            await response.json();

        if (!data.loggedIn) {

            showLogin();

            return;
        }

        showDashboard(
            data.user
        );

        await loadProfile();

    } catch (error) {

        showLogin();
    }
}


// =================================
// SHOW LOGIN
// =================================

function showLogin() {

    loginPage.style.display =
        "block";

    dashboardPage.style.display =
        "none";
}


// =================================
// SHOW DASHBOARD
// =================================

function showDashboard(user) {

    loginPage.style.display =
        "none";

    dashboardPage.style.display =
        "block";

    document.getElementById(
        "currentUsername"
    ).textContent =
        user.username;

    document.getElementById(
        "currentRole"
    ).textContent =
        user.role === "founder"
            ? "FOUNDER"
            : "UPLOADER";
}


// =================================
// LOGIN
// =================================

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        showMessage(
            loginMessage,
            "Checking login..."
        );

        const username =
            document.getElementById(
                "username"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username,
                                password
                            })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    loginMessage,
                    data.message ||
                    "Login gagal.",
                    "error"
                );

                return;
            }

            showMessage(
                loginMessage,
                "Login berhasil.",
                "success"
            );

            showDashboard(
                data.user
            );

            await loadProfile();

        } catch (error) {

            showMessage(
                loginMessage,
                "Tidak dapat terhubung ke server.",
                "error"
            );
        }
    }
);


// =================================
// LOGOUT
// =================================

logoutBtn.addEventListener(
    "click",
    async function() {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

        location.reload();
    }
);


// =================================
// LOAD PROFILE
// =================================

async function loadProfile() {

    try {

        const response =
            await fetch(
                "/api/profile"
            );

        if (!response.ok) {
            return;
        }

        const data =
            await response.json();

        const profile =
            data.profile || {};

        document.getElementById(
            "displayName"
        ).value =
            profile.displayName || "";

        document.getElementById(
            "tiktok"
        ).value =
            profile.tiktok || "";

        document.getElementById(
            "youtube"
        ).value =
            profile.youtube || "";

        document.getElementById(
            "discord"
        ).value =
            profile.discord || "";

    } catch (error) {

        console.error(
            "Profile error:",
            error
        );
    }
}


// =================================
// SAVE PROFILE
// =================================

profileForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const payload = {

            displayName:
                document.getElementById(
                    "displayName"
                ).value.trim(),

            tiktok:
                document.getElementById(
                    "tiktok"
                ).value.trim(),

            youtube:
                document.getElementById(
                    "youtube"
                ).value.trim(),

            discord:
                document.getElementById(
                    "discord"
                ).value.trim()
        };

        try {

            const response =
                await fetch(
                    "/api/profile",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                showMessage(
                    profileMessage,
                    data.message ||
                    "Gagal menyimpan profile.",
                    "error"
                );

                return;
            }

            showMessage(
                profileMessage,
                "Profile berhasil disimpan.",
                "success"
            );

        } catch (error) {

            showMessage(
                profileMessage,
                "Gagal terhubung ke server.",
                "error"
            );
        }
    }
);


// =================================
// FILE LIST
// =================================

filesInput.addEventListener(
    "change",
    function() {

        fileList.innerHTML = "";

        const files =
            Array.from(
                filesInput.files
            );

        if (!files.length) {
            return;
        }

        files.forEach(
            function(file, index) {

                const item =
                    document.createElement(
                        "div"
                    );

                item.className =
                    "file-item";

                const size =
                    formatBytes(
                        file.size
                    );

                item.innerHTML = `
                    <span>
                        ${escapeHTML(file.name)}
                    </span>

                    <small>
                                             ${size}
                    </small>
                `;

                fileList.appendChild(
                    item
                );
            }
        );
    }
);


// =================================
// FORMAT BYTES
// =================================

function formatBytes(bytes) {

    if (!bytes) {
        return "0 B";
    }

    const units = [
        "B",
        "KB",
        "MB",
        "GB"
    ];

    const index =
        Math.floor(
            Math.log(bytes) /
            Math.log(1024)
        );

    return (
        (
            bytes /
            Math.pow(
                1024,
                index
            )
        ).toFixed(
            index === 0
                ? 0
                : 2
        ) +
        " " +
        units[index]
    );
  }

  // =================================
// SHOW RESULT
// =================================

function showResult(
    data,
    modName
) {

    resultCard.style.display =
        "block";

    resultModName.textContent =
        modName;

    const shareURL =
        new URL(
            data.shareURL,
            window.location.origin
        ).href;

    const downloadURL =
        new URL(
            data.downloadURL,
            window.location.origin
        ).href;

    shareLink.value =
        shareURL;

    openShareBtn.href =
        shareURL;

    downloadBtn.href =
        downloadURL;

    if (data.discordPosted) {

        discordStatus.textContent =
            "🟢 Discord embed berhasil dikirim.";

        discordStatus.className =
            "discord-status success";

    } else {

        discordStatus.textContent =
            "🟡 File berhasil dipublish, tetapi Discord embed belum terkirim.";

        discordStatus.className =
            "discord-status warning";
    }

    resultCard.scrollIntoView({
        behavior: "smooth"
    });
}


// =================================
// COPY SHARE LINK
// =================================

copyShareBtn.addEventListener(
    "click",
    async function() {

        try {

            await navigator.clipboard.writeText(
                shareLink.value
            );

        } catch (error) {

            shareLink.select();

            document.execCommand(
                "copy"
            );
        }

        copyShareBtn.textContent =
            "COPIED";

        setTimeout(
            function() {

                copyShareBtn.textContent =
                    "COPY";

            },
            1500
        );
    }
);


// =================================
// INITIALIZE
// =================================

loadUser();

  </script>

</body>
</html>
