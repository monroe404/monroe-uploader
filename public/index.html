<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monroe File Share</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="background"></div>

<!-- ================= LOGIN ================= -->

<main id="loginPage" class="container">

    <section class="card login-card">

        <div class="brand">
            <div>
                <h1>MONROE</h1>
                <p>FILE SHARE</p>
            </div>
        </div>

        <div class="login-content">

            <span class="eyebrow">WELCOME BACK</span>

            <h2>Welcome<br>Back</h2>

            <p class="muted">
                Login untuk mengakses<br>
                Monroe File Share.
            </p>

            <form id="loginForm">

                <div class="field">
                    <label>USERNAME</label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="field">
                    <label>PASSWORD</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="primary-btn">
                    LOGIN
                </button>

                <div id="loginMessage" class="message"></div>

            </form>

        </div>

    </section>

</main>


<!-- ================= DASHBOARD ================= -->

<main id="dashboardPage" style="display:none;">

    <!-- TOPBAR -->

    <div class="topbar">

        <div class="brand">

            <div>
                <h1>MONROE</h1>
                <p>FILE SHARE</p>
            </div>

        </div>

        <div class="user-area">

            <div>
                <strong id="currentUsername">-</strong>
                <small id="currentRole">-</small>
            </div>

            <button id="logoutBtn" type="button">
                LOGOUT
            </button>

        </div>

    </div>


    <!-- UPLOAD CHOICE -->

    <div class="upload-grid">

    <!-- PUBLIC -->

    <div
        class="upload-choice"
        id="publicFileCard"
    >

        <div class="choice-icon">
            🌐
        </div>

        <span class="eyebrow">
            PUBLIC
        </span>

        <h3>
            PUBLIC FILE
        </h3>

        <p class="muted">
            Public Uploader
        </p>

    </div>


    <!-- SPECIAL -->

    <div
        class="upload-choice"
        id="specialFileCard"
    >

        <div class="choice-icon">
            🔒
        </div>

        <span class="eyebrow">
            SPECIAL
        </span>

        <h3>
            SPECIAL FILE
        </h3>

        <p class="muted">
            Special Uploader
        </p>

    </div>
      
    </div>

</main>


<script>

/* ========================================= */
/* ELEMENTS */
/* ========================================= */

const loginPage = document.getElementById("loginPage");
const dashboardPage = document.getElementById("dashboardPage");

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

const currentUsername =
    document.getElementById("currentUsername");

const currentRole =
    document.getElementById("currentRole");

const logoutBtn =
    document.getElementById("logoutBtn");

const publicFileCard =
    document.getElementById("publicFileCard");

const specialFileCard =
    document.getElementById("specialFileCard");


/* ========================================= */
/* SHOW LOGIN */
/* ========================================= */

function showLogin() {

    loginPage.style.display = "flex";

    dashboardPage.style.display = "none";

}


/* ========================================= */
/* SHOW DASHBOARD */
/* ========================================= */

function showDashboard(user) {

    loginPage.style.display = "none";

    dashboardPage.style.display = "block";

    currentUsername.textContent =
        user.username || "-";

    currentRole.textContent =
        String(user.role || "-").toUpperCase();


    /*
     * PUBLIC FILE
     * Hanya Founder
     */

    if (user.role === "founder") {

        publicFileCard.style.display = "flex";

    } else {

        publicFileCard.style.display = "none";

    }


    /*
     * SPECIAL FILE
     * Founder + Uploader
     */

    specialFileCard.style.display = "flex";

}


/* ========================================= */
/* CHECK LOGIN */
/* ========================================= */

async function checkLogin() {

    try {

        const response =
            await fetch("/api/me", {
                credentials: "include"
            });

        if (!response.ok) {

            showLogin();

            return;

        }

        const data =
            await response.json();

        if (data.loggedIn && data.user) {

            showDashboard(data.user);

        } else {

            showLogin();

        }

    } catch (error) {

        showLogin();

    }

}


/* ========================================= */
/* LOGIN */
/* ========================================= */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        loginMessage.textContent =
            "Logging in...";

        loginMessage.style.color =
            "#aaa";


        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;


        try {

            const response =
                await fetch("/api/login", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        username,
                        password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                loginMessage.textContent =
                    data.message || "Login gagal.";

                loginMessage.style.color =
                    "#ff5555";

                return;

            }


            loginMessage.textContent =
                "Login berhasil.";

            loginMessage.style.color =
                "#ff7a00";


            showDashboard(data.user);


        } catch (error) {

            loginMessage.textContent =
                "Gagal terhubung ke server.";

            loginMessage.style.color =
                "#ff5555";

        }

    }
);


/* ========================================= */
/* LOGOUT */
/* ========================================= */

logoutBtn.addEventListener(
    "click",
    async function() {

        try {

            await fetch("/api/logout", {

                method: "POST",

                credentials: "include"

            });

        } catch (error) {
            // ignore
        }


        showLogin();


        document.getElementById("username").value = "";

        document.getElementById("password").value = "";

        loginMessage.textContent = "";

    }
);


/* ========================================= */
/* PUBLIC FILE */
/* ========================================= */

publicFileCard.addEventListener(
    "click",
    function() {

        window.location.href =
            "/upload.html?type=public";

    }
);


/* ========================================= */
/* SPECIAL FILE */
/* ========================================= */

specialFileCard.addEventListener(
    "click",
    function() {

        window.location.href =
            "/upload.html?type=special";

    }
);

/* ========================================= */
/* START */
/* ========================================= */

checkLogin();

</script>

</body>
</html>
