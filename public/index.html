<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>File Share</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 18px;
      background: #202124;
      color: white;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    h1 {
      text-align: center;
      color: #ff7a00;
      font-size: 34px;
      margin: 10px 0 45px;
      font-weight: 800;
    }

    label {
      display: block;
      font-size: 23px;
      font-weight: bold;
      margin: 22px 0 10px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #f4f4f4;
      color: #222;
      padding: 17px;
      font-size: 18px;
    }

    select {
      appearance: auto;
    }

    textarea {
      min-height: 145px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 14px;
      cursor: pointer;
    }

    .section-title {
      font-size: 23px;
      font-weight: bold;
      margin-top: 30px;
      margin-bottom: 10px;
    }

    .proof-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .proof-row input {
      flex: 1;
    }

    .remove-proof {
      width: 75px;
      border: none;
      border-radius: 12px;
      background: #d62828;
      color: white;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }

    .add-proof {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #303030;
      color: white;
      padding: 18px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .send-button {
      width: 100%;
      border: none;
      border-radius: 12px;
      background: #ff7a00;
      color: white;
      padding: 18px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
    }

    .send-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      background: #181818;
      white-space: pre-wrap;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 30px;
      }

      label,
      .section-title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>MONROE UPLOAD PANEL</h1>

    <form id="uploadForm">

      <!-- CHANNEL -->

      <label>
        CHANNEL TUJUAN
      </label>

      <select
        id="channelId"
        name="channelId"
        required
      >
        <option value="">
          Memuat channel...
        </option>
      </select>

      <!-- CREDIT -->

      <label>
        MAKER BY / CREDIT
      </label>

      <input
        type="text"
        name="credits"
        placeholder="Contoh: Rasya"
      >

      <!-- DESCRIPTION -->

      <label>
        DESKRIPSI
      </label>

      <textarea
        name="description"
        placeholder="Tulis deskripsi file..."
      ></textarea>

      <!-- MAIN FILE -->

      <div class="section-title">
        📁 PILIH FILE UTAMA
      </div>

      <input
        type="file"
        name="files"
        id="mainFiles"
        multiple
        required
      >

      <!-- PROOF -->

      <div class="section-title">
        🖼️ FOTO PROOF / CDN DISCORD
      </div>

      <div id="proofContainer">

        <div class="proof-row">
          <input
            type="text"
            name="proofLinks"
            placeholder="Paste link CDN Discord..."
          >

          <button
            type="button"
            class="remove-proof"
            onclick="removeProof(this)"
          >
            ×
          </button>
        </div>

      </div>

      <button
        type="button"
        class="add-proof"
        onclick="addProof()"
      >
        + Tambah Foto
      </button>

      <!-- SEND -->

      <button
        type="submit"
        class="send-button"
        id="sendButton"
      >
        KIRIM KE DISCORD
      </button>

    </form>

    <div
      id="status"
      class="hidden"
    ></div>

  </div>

  <script>

    // =========================================
    // LOAD CHANNEL
    // =========================================

    async function loadChannels() {

      const select =
        document.getElementById("channelId");

      try {

        const response =
          await fetch("/channels");

        const data =
          await response.json();

        if (!data.success) {
          throw new Error(
            data.message ||
            "Gagal mengambil channel."
          );
        }

        select.innerHTML =
          '<option value="">Pilih Channel</option>';

        data.channels.forEach(channel => {

          const option =
            document.createElement("option");

          option.value =
            channel.id;

          option.textContent =
            "#" + channel.name;

          select.appendChild(option);

        });

      } catch (error) {

        select.innerHTML =
          '<option value="">Gagal memuat channel</option>';

        console.error(error);

      }
    }

    loadChannels();


    // =========================================
    // PROOF
    // =========================================

    function addProof() {

      const container =
        document.getElementById(
          "proofContainer"
        );

      const row =
        document.createElement("div");

      row.className =
        "proof-row";

      row.innerHTML = `
        <input
          type="text"
          name="proofLinks"
          placeholder="Paste link CDN Discord..."
        >

        <button
          type="button"
          class="remove-proof"
          onclick="removeProof(this)"
        >
          ×
        </button>
      `;

      container.appendChild(row);
    }


    function removeProof(button) {

      const container =
        document.getElementById(
          "proofContainer"
        );

      const rows =
        container.querySelectorAll(
          ".proof-row"
        );

      if (rows.length <= 1) {
        rows[0]
          .querySelector("input")
          .value = "";

        return;
      }

      button.parentElement.remove();
    }


    // =========================================
    // SUBMIT
    // =========================================

    const form =
      document.getElementById(
        "uploadForm"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const status =
      document.getElementById(
        "status"
      );


    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const files =
          document.getElementById(
            "mainFiles"
          ).files;

        const channelId =
          document.getElementById(
            "channelId"
          ).value;

        if (!channelId) {
          alert(
            "Pilih channel tujuan dulu."
          );
          return;
        }

        if (!files.length) {
          alert(
            "Pilih file utama dulu."
          );
          return;
        }

        sendButton.disabled = true;
        sendButton.textContent =
          "MENGIRIM...";

        status.classList.remove(
          "hidden"
        );

        status.textContent =
          "⏳ Sedang mengirim file...";

        try {

          const formData =
            new FormData(form);

          const response =
            await fetch(
              "/upload",
              {
                method: "POST",
                body: formData
              }
            );

          const data =
            await response.json();

          if (!data.success) {
            throw new Error(
              data.message ||
              "Upload gagal."
            );
          }

          let resultText =
            "✅ Berhasil dikirim!\n\n";

          data.results.forEach(
            item => {

              if (item.success) {

                resultText +=
                  `✅ ${item.file}\n`;

              } else {

                resultText +=
                  `❌ ${item.file}: ${item.error}\n`;

              }

            }
          );

          status.textContent =
            resultText;

          form.reset();

        } catch (error) {

          status.textContent =
            "❌ " + error.message;

        } finally {

          sendButton.disabled = false;

          sendButton.textContent =
            "KIRIM KE DISCORD";

        }

      }
    );

  </script>

</body>

</html>
