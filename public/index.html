<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>File Share</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px 18px;

      background:
        radial-gradient(
          circle at top,
          rgba(255, 122, 0, 0.10),
          transparent 35%
        ),
        #202124;

      color: white;

      font-family:
        Arial,
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 680px;
      margin: auto;
    }

    h1 {
      text-align: center;

      color: #ff7a00;

      font-size: 34px;

      margin:
        10px 0 45px;

      font-weight: 800;

      text-shadow:
        0 0 12px
        rgba(255, 122, 0, 0.25);
    }

    label,
    .section-title {
      display: block;

      font-size: 22px;

      font-weight: bold;

      margin:
        22px 0 10px;
    }

    input,
    select {
      width: 100%;

      border:
        1px solid #3b3b3b;

      outline: none;

      border-radius: 12px;

      background: #f4f4f4;

      color: #222;

      padding: 17px;

      font-size: 18px;

      transition:
        0.2s;
    }

    input:focus,
    select:focus {
      border-color:
        #ff7a00;

      box-shadow:
        0 0 0 2px
        rgba(
          255,
          122,
          0,
          0.15
        );
    }

    input[type="file"] {
      padding: 14px;

      cursor: pointer;
    }

    .proof-row {
      display: flex;

      gap: 10px;

      margin-bottom: 12px;
    }

    .proof-row input {
      flex: 1;
    }

    .remove-proof {
      width: 70px;

      border: none;

      border-radius: 12px;

      background: #d62828;

      color: white;

      font-size: 24px;

      font-weight: bold;

      cursor: pointer;
    }

    .add-proof {
      width: 100%;

      border:
        1px solid #4a4a4a;

      border-radius: 12px;

      background: #292929;

      color: #ff9a3c;

      padding: 18px;

      font-size: 19px;

      font-weight: bold;

      cursor: pointer;

      transition:
        0.2s;
    }

    .add-proof:hover {
      background:
        #33271f;

      border-color:
        #ff7a00;
    }

    .send-button {
      width: 100%;

      border: none;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #ff7a00,
          #ff941f
        );

      color: white;

      padding: 18px;

      font-size: 20px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 30px;

      box-shadow:
        0 5px 18px
        rgba(
          255,
          122,
          0,
          0.22
        );

      transition:
        0.2s;
    }

    .send-button:hover {
      transform:
        translateY(-1px);

      box-shadow:
        0 7px 22px
        rgba(
          255,
          122,
          0,
          0.32
        );
    }

    .send-button:disabled {
      opacity: 0.5;

      transform: none;

      cursor:
        not-allowed;
    }

    #status {
      margin-top: 18px;

      padding: 15px;

      border-radius: 10px;

      background: #181818;

      border-left:
        3px solid #ff7a00;

      white-space:
        pre-wrap;
    }

    @media (max-width: 500px) {

      body {
        padding:
          20px 15px;
      }

      h1 {
        font-size: 30px;

        margin-bottom:
          35px;
      }

      label,
      .section-title {
        font-size: 20px;
      }

      input,
      select {
        font-size: 16px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <h1>
      FILE SHARE
    </h1>

    <form id="uploadForm">

      <!-- CHANNEL -->

      <label>
        CHANNEL TUJUAN
      </label>

      <select
        id="channelId"
        name="channelId"
        required
      >

        <option value="">
          Memuat channel...
        </option>

      </select>


      <!-- CREDIT -->

      <label>
        MAKER BY / CREDIT
      </label>

      <input
        id="credits"
        type="text"
        name="credits"
        placeholder="Contoh: Rell"
      >


      <!-- FILE -->

      <div class="section-title">
        📁 PILIH FILE
      </div>

      <input
        id="mainFiles"
        type="file"
        name="files"
        multiple
        required
      >


      <!-- PROOF -->

      <div class="section-title">
        🖼️ FOTO PROOF / CDN DISCORD
      </div>

      <div id="proofContainer">

        <div class="proof-row">

          <input
            type="text"
            name="proofLinks"
            placeholder="Paste link CDN Discord..."
          >

          <button
            type="button"
            class="remove-proof"
            onclick="removeProof(this)"
          >
            ×
          </button>

        </div>

      </div>


      <button
        type="button"
        class="add-proof"
        onclick="addProof()"
      >
        + Tambah Foto
      </button>


      <!-- SEND -->

      <button
        id="sendButton"
        type="submit"
        class="send-button"
      >
        KIRIM KE DISCORD
      </button>

    </form>


    <div id="status"></div>

  </div>


  <script>

    // ========================================
    // LOAD CHANNEL
    // ========================================

    async function loadChannels() {

      const select =
        document.getElementById(
          "channelId"
        );

      try {

        const response =
          await fetch(
            "/channels"
          );

        const data =
          await response.json();

        if (!data.success) {

          throw new Error(
            data.message
          );

        }

        select.innerHTML =
          '<option value="">Pilih Channel</option>';

        data.channels.forEach(
          channel => {

            const option =
              document.createElement(
                "option"
              );

            option.value =
              channel.id;

            option.textContent =
              "#" +
              channel.name;

            select.appendChild(
              option
            );

          }
        );

      } catch (error) {

        console.error(
          "Channel Error:",
          error
        );

        select.innerHTML =
          '<option value="">Gagal memuat channel</option>';

      }

    }

    loadChannels();


    // ========================================
    // ADD PROOF
    // ========================================

    function addProof() {

      const container =
        document.getElementById(
          "proofContainer"
        );

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "proof-row";

      row.innerHTML = `
        <input
          type="text"
          name="proofLinks"
          placeholder="Paste link CDN Discord..."
        >

        <button
          type="button"
          class="remove-proof"
          onclick="removeProof(this)"
        >
          ×
        </button>
      `;

      container.appendChild(
        row
      );

    }


    // ========================================
    // REMOVE PROOF
    // ========================================

    function removeProof(
      button
    ) {

      const container =
        document.getElementById(
          "proofContainer"
        );

      const rows =
        container.querySelectorAll(
          ".proof-row"
        );

      if (
        rows.length === 1
      ) {

        rows[0]
          .querySelector(
            "input"
          )
          .value = "";

        return;

      }

      button
        .parentElement
        .remove();

    }


    // ========================================
    // SUBMIT
    // ========================================

    document
      .getElementById(
        "uploadForm"
      )
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const channelSelect =
            document.getElementById(
              "channelId"
            );

          const channelId =
            channelSelect.value;

          const files =
            document.getElementById(
              "mainFiles"
            ).files;

          const creditsInput =
            document.getElementById(
              "credits"
            );

          const sendButton =
            document.getElementById(
              "sendButton"
            );

          const status =
            document.getElementById(
              "status"
            );

          if (!channelId) {

            alert(
              "Pilih channel tujuan."
            );

            return;

          }

          if (!files.length) {

            alert(
              "Pilih file."
            );

            return;

          }

          // CHANNEL DISIMPAN

          const selectedChannel =
            channelId;

          sendButton.disabled =
            true;

          sendButton.textContent =
            "MENGIRIM...";

          status.textContent =
            "⏳ Mengirim file ke Discord...";

          try {

            const formData =
              new FormData();

            // CHANNEL

            formData.append(
              "channelId",
              channelId
            );


            // CREDIT

            formData.append(
              "credits",
              creditsInput.value
            );


            // FILE

            for (
              const file of files
            ) {

              formData.append(
                "files",
                file
              );

            }


            // PROOF CDN

            const proofInputs =
              document.querySelectorAll(
                'input[name="proofLinks"]'
              );

            proofInputs.forEach(
              input => {

                const value =
                  input.value.trim();

                if (value) {

                  formData.append(
                    "proofLinks",
                    value
                  );

                }

              }
            );


            // SEND

            const response =
              await fetch(
                "/upload",
                {
                  method: "POST",

                  body: formData
                }
              );


            const data =
              await response.json();


            if (
              !response.ok ||
              !data.success
            ) {

              throw new Error(
                data.message ||
                "Upload gagal."
              );

            }


            status.textContent =
              "✅ Berhasil dikirim ke Discord!";


            // ==================================
            // RESET CREDIT
            // ==================================

            creditsInput.value =
              "";


            // ==================================
            // RESET FILE
            // ==================================

            document.getElementById(
              "mainFiles"
            ).value =
              "";


            // ==================================
            // RESET CDN
            // ==================================

            document.getElementById(
              "proofContainer"
            ).innerHTML = `
              <div class="proof-row">

                <input
                  type="text"
                  name="proofLinks"
                  placeholder="Paste link CDN Discord..."
                >

                <button
                  type="button"
                  class="remove-proof"
                  onclick="removeProof(this)"
                >
                  ×
                </button>

              </div>
            `;


            // ==================================
            // CHANNEL TETAP
            // ==================================

            channelSelect.value =
              selectedChannel;


          } catch (error) {

            console.error(
              "Upload Error:",
              error
            );

            status.textContent =
              "❌ " +
              error.message;

          } finally {

            sendButton.disabled =
              false;

            sendButton.textContent =
              "KIRIM KE DISCORD";

          }

        }
      );

  </script>

</body>

</html>
