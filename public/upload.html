<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monroe File Uploader</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="background"></div>

<main class="container">

    <section class="card upload-page">

        <div class="upload-page-header">
            <div class="brand">
                <div>
                    <h1>MONROE</h1>
                    <p>FILE SHARE</p>
                </div>
            </div>
        </div>


        <div class="upload-page-title">

            <span class="eyebrow">UPLOADER</span>

            <h2 id="uploadTitle">
                PUBLIC FILE
            </h2>

            <p id="uploadDescription" class="muted">
                Upload file yang dapat dibagikan secara publik.
            </p>

        </div>


        <form
            id="uploadForm"
            enctype="multipart/form-data"
        >

            <input
                id="fileType"
                type="hidden"
                name="type"
                value="public"
            >


            <!-- PUBLIC CHANNEL -->

            <div
                class="field"
                id="channelField"
            >

                <label>
                    CHANNEL / MOD
                </label>

                <input
                    type="text"
                    id="channelSearch"
                    placeholder="🔎 Cari channel, contoh: skin asian"
                    autocomplete="off"
                >

                <input
                    type="hidden"
                    id="channelId"
                    name="channelId"
                >

                <div
                    id="channelResults"
                    class="channel-results"
                ></div>

            </div>


            <!-- CREDIT -->

            <div class="field">

                <label>
                    CREDITS / MAKER
                </label>

                <input
                    type="text"
                    name="credits"
                    placeholder="Contoh: SkyMods"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="field">

                <label>
                    DESCRIPTION
                </label>

                <textarea
                    name="description"
                    rows="6"
                    placeholder="Deskripsi file / mod..."
                ></textarea>

            </div>


            <!-- SPECIAL SOCIAL -->

            <div
                id="socialFields"
                style="display:none;"
            >

                <div class="field">

                    <label>
                        TIKTOK NAME (OPTIONAL)
                    </label>

                    <input
                        type="text"
                        name="tiktok"
                        placeholder="@username"
                    >

                </div>


                <div class="field">

                    <label>
                        YOUTUBE NAME (OPTIONAL)
                    </label>

                    <input
                        type="text"
                        name="youtube"
                        placeholder="Nama channel YouTube"
                    >

                </div>

            </div>


            <!-- DISCORD CDN -->

            <div class="field">

                <label>
                    🖼️ DISCORD CDN IMAGE
                </label>

                <input
                    type="url"
                    name="previewUrl"
                    placeholder="https://cdn.discordapp.com/..."
                >

                <small>
                    Paste link gambar dari Discord CDN.
                </small>

            </div>


            <!-- FILES -->

            <div class="field">

                <label>
                    📁 MOD FILES
                </label>

                <input
                    type="file"
                    name="files"
                    multiple
                    required
                >

                <small>
                    Semua file akan otomatis dijadikan ZIP.
                </small>

            </div>


            <button
                type="submit"
                class="primary-btn"
            >
                📦 PUBLISH FILE
            </button>


            <div
                id="uploadMessage"
                class="message"
            ></div>

        </form>


        <button
            type="button"
            class="secondary-btn"
            onclick="history.back()"
        >
            ← BACK
        </button>

    </section>

</main>


<script src="/upload.js"></script>

</body>
</html>
