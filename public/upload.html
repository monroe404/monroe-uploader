<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monroe File Uploader</title>

    <link
        rel="stylesheet"
        href="/style.css"
    >
</head>

<body>

<div class="background"></div>

<main class="container">

<section class="card upload-page">

    <!-- HEADER -->

    <div class="upload-page-header">

        <div class="brand">

            <div>

                <h1>MONROE</h1>

                <p>FILE SHARE</p>

            </div>

        </div>

    </div>


    <!-- TITLE -->

    <div class="upload-page-title">

        <span class="eyebrow">
            UPLOADER
        </span>

        <h2 id="uploadTitle">
            PUBLIC FILE
        </h2>

        <p
            id="uploadDescription"
            class="muted"
        >
            Upload file yang dapat dibagikan secara publik.
        </p>

    </div>


    <!-- FORM -->

    <form
        id="uploadForm"
        enctype="multipart/form-data"
    >

        <!-- TYPE -->

        <input
            id="fileType"
            type="hidden"
            name="type"
            value="public"
        >


        <!-- CHANNEL -->

        <div class="field" id="channelField">

    <label>CHANNEL</label>

    <div class="channel-picker">

        <input
            type="text"
            id="channelSearch"
            placeholder="🔎 Cari atau pilih channel..."
            autocomplete="off"
        >

        <button
            type="button"
            id="channelDropdownButton"
            class="channel-dropdown-button"
        >
            ▼
        </button>

    </div>

    <input
        type="hidden"
        id="channelId"
        name="channelId"
    >

    <div
        id="channelResults"
        class="channel-results"
    ></div>

        </div>


        <!-- CREDITS -->

        <div class="field">

            <label>
                CREDITS / MAKER
            </label>

            <input
                type="text"
                name="credits"
                placeholder="Contoh: Rasya Gantengs"
                required
            >

        </div>


        <!-- SPECIAL SOCIAL -->

        <div
            id="socialFields"
            style="display:none;"
        >

            <div class="field">

                <label>
                    TIKTOK NAME
                    <span>(OPTIONAL)</span>
                </label>

                <input
                    type="text"
                    name="tiktok"
                    placeholder="@username"
                >

            </div>


            <div class="field">

                <label>
                    YOUTUBE NAME
                    <span>(OPTIONAL)</span>
                </label>

                <input
                    type="text"
                    name="youtube"
                    placeholder="Nama channel YouTube"
                >

            </div>

        </div>


        <!-- PREVIEW -->

        <div class="field">

            <label>
                PREVIEW IMAGES
            </label>

            <div id="previewList">

                <div class="preview-input-row">

                    <input
                        type="url"
                        name="previewUrls"
                        placeholder="https://cdn.discordapp.com/..."
                    >

                    <button
                        type="button"
                        class="remove-preview"
                        onclick="removePreview(this)"
                    >
                        ×
                    </button>

                </div>

            </div>


            <button
                type="button"
                class="add-preview-btn"
                onclick="addPreview()"
            >
                ＋ TAMBAH FOTO
            </button>


            <small>
                Maksimal 10 foto preview.
            </small>

        </div>


        <!-- FILE -->

        <div class="field">

            <label>
                MOD FILES
            </label>

            <input
                type="file"
                name="files"
                multiple
                required
            >

            <small>
                Semua file akan dikirim satu per satu.
            </small>

        </div>


        <!-- PUBLISH -->

        <button
            type="submit"
            class="primary-btn"
        >
            PUBLISH FILE
        </button>


        <!-- MESSAGE -->

        <div
            id="uploadMessage"
            class="message"
        ></div>

    </form>


    <!-- BACK -->

    <button
        type="button"
        class="secondary-btn"
        onclick="history.back()"
    >
        ← BACK
    </button>

</section>

</main>


<script src="/upload.js"></script>

</body>
</html>
