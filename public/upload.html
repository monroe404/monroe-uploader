<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monroe File Uploader</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="background"></div>

<main class="container">

    <section class="card upload-page">

        <!-- HEADER -->

        <div class="upload-page-header">

            <div class="brand">
                <div>
                    <h1>MONROE</h1>
                    <p>FILE SHARE</p>
                </div>
            </div>

        </div>


        <!-- TITLE -->

        <div class="upload-page-title">

            <span class="eyebrow">
                UPLOADER
            </span>

            <h2 id="uploadTitle">
                PUBLIC FILE
            </h2>

            <p id="uploadDescription" class="muted">
                Upload file yang dapat dibagikan secara publik.
            </p>

        </div>


        <!-- FORM -->

        <form
            id="uploadForm"
            enctype="multipart/form-data"
        >

            <!-- TYPE -->

            <input
                id="fileType"
                type="hidden"
                name="type"
                value="public"
            >


            <!-- CHANNEL -->

            <div class="field">

                <label>
                    CHANNEL / MOD
                </label>

                <input
                    type="text"
                    id="channelSearch"
                    name="channel"
                    placeholder="🔎 Cari channel, contoh: skin asian"
                    autocomplete="off"
                    required
                >

                <div
                    id="channelResults"
                    class="channel-results"
                ></div>

            </div>


            <!-- CREDIT -->

            <div class="field">

                <label>
                    CREDITS / MAKER
                </label>

                <input
                    type="text"
                    name="credits"
                    placeholder="Contoh: SkyMods"
                    required
                >

            </div>


            <!-- DESCRIPTION -->

            <div class="field">

                <label>
                    DESCRIPTION
                </label>

                <textarea
                    name="description"
                    rows="6"
                    placeholder="Deskripsi file / mod..."
                ></textarea>

            </div>


            <!-- DISCORD CDN -->

            <div class="field">

                <label>
                    🖼️ DISCORD CDN IMAGE
                </label>

                <input
                    type="url"
                    name="previewUrl"
                    placeholder="https://cdn.discordapp.com/..."
                >

                <small>
                    Paste link gambar dari Discord CDN.
                </small>

            </div>


            <!-- FILES -->

            <div class="field">

                <label>
                    📁 MOD FILES
                </label>

                <input
                    type="file"
                    name="files"
                    multiple
                    required
                >

                <small>
                    Semua file akan otomatis dijadikan ZIP.
                </small>

            </div>


            <!-- PUBLISH -->

            <button
                type="submit"
                class="primary-btn"
            >
                📦 PUBLISH FILE
            </button>


            <div
                id="uploadMessage"
                class="message"
            ></div>

        </form>


        <!-- BACK -->

        <button
            type="button"
            class="secondary-btn"
            onclick="history.back()"
        >
            ← BACK
        </button>

    </section>

</main>


<script>

/* =========================================
   GET UPLOAD TYPE
========================================= */

const params =
    new URLSearchParams(window.location.search);

const type =
    params.get("type") === "special"
        ? "special"
        : "public";


/* =========================================
   ELEMENTS
========================================= */

const uploadTitle =
    document.getElementById("uploadTitle");

const uploadDescription =
    document.getElementById("uploadDescription");

const fileType =
    document.getElementById("fileType");


/* =========================================
   SET TYPE
========================================= */

fileType.value = type;


if (type === "special") {

    uploadTitle.textContent =
        "SPECIAL FILE";

    uploadDescription.textContent =
        "Upload file khusus untuk Founder dan Uploader.";

} else {

    uploadTitle.textContent =
        "PUBLIC FILE";

    uploadDescription.textContent =
        "Upload file yang dapat dibagikan secara publik.";

}


/* =========================================
   FORM
========================================= */

document
    .getElementById("uploadForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const message =
            document.getElementById("uploadMessage");

        message.textContent =
            "Upload system belum dihubungkan.";

    });

</script>

</body>
</html>
