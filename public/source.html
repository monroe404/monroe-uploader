<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monroe Source Mods</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="background"></div>

<main class="container">

    <section class="card upload-card">

        <div class="brand">
            <div>
                <h1>MONROE</h1>
                <p>SOURCE MODS</p>
            </div>
        </div>

        <div class="login-content">

            <div class="source-header">

                <div>
                    <span class="eyebrow">SOURCE</span>

                    <h2>Discord<br>Servers</h2>
                </div>

                <button
                    type="button"
                    id="addSourceBtn"
                    class="source-add-btn"
                >
                    +
                </button>

            </div>

            <p class="muted">
                Discord server source mods.
            </p>

            <div id="sourceList" class="source-list">
                <div class="source-loading">
                    Loading...
                </div>
            </div>

            <!-- ADD SOURCE FORM -->

            <form
                id="sourceForm"
                style="display:none;"
            >

                <div class="field">

                    <label>DISCORD SERVER LINK</label>

                    <input
                        type="url"
                        id="sourceLink"
                        placeholder="https://discord.gg/..."
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    ADD SOURCE
                </button>

                <div
                    id="sourceMessage"
                    class="message"
                ></div>

            </form>

            <button
                type="button"
                id="backBtn"
                class="secondary-btn"
                style="margin-top:10px;"
            >
                BACK
            </button>

        </div>

    </section>

</main>

<script src="/source.js"></script>

</body>
</html>
